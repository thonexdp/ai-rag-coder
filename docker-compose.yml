version: "3.9"

services:

  # ---------------------------------------------------------
  # PostgreSQL - relational data (users, schedules, courses, chat history)
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: school_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_pass}
      POSTGRES_DB: ${POSTGRES_DB:-school_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-school_user} -d ${POSTGRES_DB:-school_assistant}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # Ollama - local LLM runtime (Qwen2.5 7B)
  # ---------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: school_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if NVIDIA GPU + nvidia-container-toolkit available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---------------------------------------------------------
  # ChromaDB - vector database for RAG document chunks
  # ---------------------------------------------------------
  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: school_chromadb
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "9001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # ---------------------------------------------------------
  # Backend - FastAPI app (placeholder code, real logic added later)
  # ---------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-school_user}:${POSTGRES_PASSWORD:-school_pass}@postgres:5432/${POSTGRES_DB:-school_assistant}
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      chromadb:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
  chroma_data:
