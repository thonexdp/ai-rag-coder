version: "3.9"

services:

  # ---------------------------------------------------------
  # PostgreSQL - relational data (users, schedules, courses, chat history)
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: school_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_pass}
      POSTGRES_DB: ${POSTGRES_DB:-school_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # Ollama - local LLM runtime (Qwen2.5 7B + nomic-embed-text)
  # ---------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: school_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    # GPU support (uncomment if NVIDIA GPU + nvidia-container-toolkit available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---------------------------------------------------------
  # Ollama Init - auto-pulls required models on first startup
  # Runs once and exits. Models are cached in ollama_data volume.
  # ---------------------------------------------------------
  ollama-init:
    image: curlimages/curl:latest
    container_name: school_ollama_init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '>>> Pulling qwen2.5:7b (LLM)...' &&
        curl -s -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d '{\"name\":\"qwen2.5:7b\"}' &&
        echo '>>> Pulling nomic-embed-text (Embeddings)...' &&
        curl -s -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d '{\"name\":\"nomic-embed-text\"}' &&
        echo '>>> Models ready.'
      "

  # ---------------------------------------------------------
  # ChromaDB - vector database for RAG document chunks
  # ---------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: school_chromadb
    restart: unless-stopped
    ports:
      - "9001:8000"           # host 9001 → container 8000 (avoids host conflict)
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # Backend - FastAPI (port 9000 inside container, matches Dockerfile)
  # ---------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-school_user}:${POSTGRES_PASSWORD:-school_pass}@postgres:5432/${POSTGRES_DB:-school_assistant}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000          # internal Docker network port, NOT host 9001
    ports:
      - "9000:9000"             # matches your Dockerfile EXPOSE + CMD port
    volumes:
      - ./backend:/app           # live-reload during development
      - ./data:/app/data         # uploaded documents + vector data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:      # persists pulled models -- won't re-download on restart
  chroma_data:
